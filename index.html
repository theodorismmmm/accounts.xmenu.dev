<!-- accounts.xmenu.dev / index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XMenu Accounts</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background:#0f172a; color:#e2e8f0; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background: radial-gradient(circle at top, #1e293b, #0f172a 65%); }
      main { width:min(560px,100%); background:rgba(15,23,42,.88); border:1px solid rgba(148,163,184,.2); border-radius:18px; padding:20px; display:grid; gap:14px; box-shadow: 0 30px 80px rgba(15,23,42,.17); }
      h1 { margin:0; font-size:1.3rem; }
      .msg { color:#94a3b8; min-height:1.2em; }
      input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(148,163,184,.3); background:rgba(15,23,42,.8); color:#e2e8f0; }
      input:focus { outline:none; border-color:#38bdf8; box-shadow:0 0 0 3px rgba(56,189,248,.12); }
      .row { display:flex; gap:10px; flex-wrap:wrap; }
      button {
        padding:12px 14px; border-radius:999px; border:1px solid rgba(148,163,184,.35);
        background:transparent; color:#e2e8f0; font-weight:800; cursor:pointer;
      }
      button.primary { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color:#0f172a; border-color: transparent; }
      hr { border:none; border-top:1px solid rgba(148,163,184,.15); }
      .pill { display:inline-block; padding:6px 10px; border-radius:999px; border:1px solid rgba(148,163,184,.25); color:#cbd5e1; font-size:.9rem; }
      .hidden { display:none; }
      #lang-btn { margin-left: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center;">
        <h1 id="ui-account-label">Account</h1>
        <span class="pill" id="returnPill">returnTo: —</span>
        <button id="lang-btn" type="button" aria-label="Switch language">Deutsch</button>
      </div>

      <div class="msg" id="msg"></div>

      <section id="authSection">
        <input id="email" type="email" placeholder="Email" autocomplete="email" />
        <div style="height:10px"></div>
        <input id="password" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password" />

        <div style="height:12px"></div>
        <div class="row">
          <button class="primary" id="login" type="button">Login</button>
          <button id="register" type="button">Register</button>
        </div>
      </section>

      <section id="profileSection" class="hidden">
        <hr />
        <div style="font-weight:800;" id="ui-profile-label">Profile</div>
        <div class="msg" id="ui-signedin-label">Signed in as: <span id="signedInAs">—</span></div>
        <input id="name" type="text" placeholder="Display name (shown on xmenu.dev / rls.xmenu.dev)" maxlength="60" />
        <div style="height:12px"></div>
        <div class="row">
          <button class="primary" id="saveName" type="button">Save name</button>
          <button id="logout" type="button">Logout</button>
          <button id="back" type="button">Back</button>
        </div>

        <hr />
        <div style="font-weight:800;" id="ui-danger-label">Danger zone</div>
        <div class="row">
          <button id="delete" type="button">Delete account</button>
        </div>
      </section>
    </main>

    <script type="module">
      import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

      // Language dictionary – add new static UI text here
      const strings = {
        en: {
          account: "Account",
          returnTo: "returnTo",
          login: "Login",
          register: "Register",
          email: "Email",
          password: "Password (min 6 chars)",
          profile: "Profile",
          signedInAs: "Signed in as:",
          displayName: "Display name (shown on xmenu.dev / rls.xmenu.dev)",
          saveName: "Save name",
          logout: "Logout",
          back: "Back",
          dangerZone: "Danger zone",
          deleteAccount: "Delete account",
          loggedOut: "Logged out.",
          saved: "Saved.",
          checkEmail: "Check your email to confirm the account, then log in.",
          notLoggedIn: "Not logged in.",
          noSession: "No session returned."
        },
        de: {
          account: "Konto",
          returnTo: "zurückZu",
          login: "Anmelden",
          register: "Registrieren",
          email: "E-Mail",
          password: "Passwort (mind. 6 Zeichen)",
          profile: "Profil",
          signedInAs: "Angemeldet als:",
          displayName: "Anzeigename (erscheint auf xmenu.dev / rls.xmenu.dev)",
          saveName: "Name speichern",
          logout: "Abmelden",
          back: "Zurück",
          dangerZone: "Gefahrenbereich",
          deleteAccount: "Konto löschen",
          loggedOut: "Abgemeldet.",
          saved: "Gespeichert.",
          checkEmail: "Prüfe deine E-Mails, um das Konto zu bestätigen, und melde dich dann an.",
          notLoggedIn: "Nicht angemeldet.",
          noSession: "Keine Sitzung zurückgegeben."
        }
      };

      let lang = localStorage.getItem("lang") || "en";
      function setLang(newLang) {
        lang = newLang;
        localStorage.setItem("lang", lang);
        updateLang();
      }

      function updateLang() {
        const t = strings[lang];
        document.documentElement.lang = lang;
        document.getElementById("ui-account-label").textContent = t.account;
        document.getElementById("returnPill").textContent = `${t.returnTo}: ${returnTo}`;
        document.getElementById("login").textContent = t.login;
        document.getElementById("register").textContent = t.register;
        document.getElementById("email").placeholder = t.email;
        document.getElementById("password").placeholder = t.password;
        document.getElementById("ui-profile-label").textContent = t.profile;
        document.getElementById("ui-signedin-label").childNodes[0].textContent = t.signedInAs + " ";
        document.getElementById("name").placeholder = t.displayName;
        document.getElementById("saveName").textContent = t.saveName;
        document.getElementById("logout").textContent = t.logout;
        document.getElementById("back").textContent = t.back;
        document.getElementById("ui-danger-label").textContent = t.dangerZone;
        document.getElementById("delete").textContent = t.deleteAccount;
        document.getElementById("lang-btn").textContent = lang === "en" ? "Deutsch" : "English";
      }

      document.getElementById("lang-btn").addEventListener("click", () => {
        setLang(lang === "en" ? "de" : "en");
      });

      // Replace with your project values
      const SUPABASE_URL = "https://miivgganhzzqfzebmaxx.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1paXZnZ2FuaHp6cWZ6ZWJtYXh4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyOTg0OTYsImV4cCI6MjA4NTg3NDQ5Nn0.WA[...]

      const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const qs = new URLSearchParams(location.search);
      const returnTo = qs.get("returnTo") || "https://xmenu.dev/";

      const msgEl = document.getElementById("msg");
      const authSection = document.getElementById("authSection");
      const profileSection = document.getElementById("profileSection");

      const emailEl = document.getElementById("email");
      const passwordEl = document.getElementById("password");
      const nameEl = document.getElementById("name");
      const signedInAsEl = document.getElementById("signedInAs");

      const setMsg = (t) => {
        msgEl.textContent = t || "";
        if (t) console.log("[UI] Message:", t);
      };

      // Input validation helpers
      function isValidEmail(email) {
        // Basic email validation - server will do more thorough validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return emailRegex.test(email);
      }

      function isValidPassword(password) {
        return password && password.length >= 6;
      }

      function validateInputs(email, password) {
        if (!email || !email.trim()) {
          setMsg("Please enter an email address");
          return false;
        }
        if (!isValidEmail(email)) {
          setMsg("Please enter a valid email address");
          return false;
        }
        if (!password) {
          setMsg("Please enter a password");
          return false;
        }
        if (!isValidPassword(password)) {
          setMsg("Password must be at least 6 characters");
          return false;
        }
        return true;
      }

      // Whitelist of allowed domains for returnTo URL to prevent open redirect attacks
      const ALLOWED_RETURN_DOMAINS = [
        "xmenu.dev",
        "rls.xmenu.dev",
        "accounts.xmenu.dev",
        "localhost" // For development
      ];

      function isValidReturnToUrl(url) {
        try {
          const parsed = new URL(url);
          // Only allow http/https protocols
          if (parsed.protocol !== "http:" && parsed.protocol !== "https:") {
            console.warn("[Security] Invalid protocol in returnTo:", parsed.protocol);
            return false;
          }
          
          // Check if the domain is in the whitelist
          const hostname = parsed.hostname;
          const isAllowed = ALLOWED_RETURN_DOMAINS.some(domain => {
            return hostname === domain || hostname.endsWith("." + domain);
          });
          
          if (!isAllowed) {
            console.warn("[Security] Domain not in whitelist:", hostname);
            return false;
          }
          
          return true;
        } catch (err) {
          console.warn("[Security] Invalid URL in returnTo:", err);
          return false;
        }
      }

      async function ensureProfileRow(userId) {
        try {
          console.log("[Profile] Checking profile for user:", userId);
          const { data, error } = await supabase
            .from("profiles")
            .select("user_id")
            .eq("user_id", userId)
            .maybeSingle();

          if (!error && data) {
            console.log("[Profile] Profile already exists");
            return;
          }

          console.log("[Profile] Creating new profile row");
          const { error: insertError } = await supabase
            .from("profiles")
            .insert({ user_id: userId, display_name: "" });
          
          if (insertError) {
            console.error("[Profile] Error creating profile:", insertError);
          }
        } catch (err) {
          console.error("[Profile] Unexpected error in ensureProfileRow:", err);
        }
      }

      async function loadProfile(user) {
        try {
          await ensureProfileRow(user.id);

          console.log("[Profile] Loading profile for user:", user.email);
          const { data, error } = await supabase
            .from("profiles")
            .select("display_name")
            .eq("user_id", user.id)
            .maybeSingle();

          if (error) {
            console.error("[Profile] Error loading profile:", error);
            nameEl.value = "";
            return;
          }

          nameEl.value = data?.display_name || "";
          console.log("[Profile] Profile loaded successfully");
        } catch (err) {
          console.error("[Profile] Unexpected error loading profile:", err);
          nameEl.value = "";
        }
      }

      function redirectToReturnToWithSession(session) {
        try {
          console.log("[Redirect] Preparing redirect to:", returnTo);
          
          // Validate returnTo URL
          if (!isValidReturnToUrl(returnTo)) {
            console.error("[Redirect] Invalid returnTo URL:", returnTo);
            setMsg("Invalid return URL. Cannot redirect.");
            return;
          }

          // returnTo can be https://xmenu.dev/ or https://rls.xmenu.dev/ (or any allowed origin)
          const origin = new URL(returnTo).origin;
          const callback = new URL("/auth/callback.html", origin);

          console.log("[Redirect] Target callback URL:", callback.toString());

          callback.hash = new URLSearchParams({
            access_token: session.access_token,
            refresh_token: session.refresh_token,
            returnTo
          }).toString();

          console.log("[Redirect] Redirecting with session tokens");
          location.assign(callback.toString());
        } catch (err) {
          console.error("[Redirect] Error during redirect:", err);
          setMsg("Failed to redirect. Error: " + err.message);
        }
      }

      async function showLoggedOut() {
        authSection.classList.remove("hidden");
        profileSection.classList.add("hidden");
        signedInAsEl.textContent = "—";
        nameEl.value = "";
      }

      async function showLoggedIn(user) {
        authSection.classList.add("hidden");
        profileSection.classList.remove("hidden");
        signedInAsEl.textContent = user.email || user.id;
        await loadProfile(user);
      }

      document.getElementById("login").addEventListener("click", async () => {
        try {
          setMsg("");
          const email = emailEl.value.trim();
          const password = passwordEl.value;

          console.log("[Auth] Login attempt for:", email);

          // Validate inputs
          if (!validateInputs(email, password)) {
            return;
          }

          const { data, error } = await supabase.auth.signInWithPassword({ email, password });
          
          if (error) {
            console.error("[Auth] Login error:", error);
            setMsg(error.message);
            return;
          }
          
          if (!data.session) {
            console.error("[Auth] Login succeeded but no session returned");
            setMsg(strings[lang].noSession);
            return;
          }

          console.log("[Auth] Login successful for:", data.user.email);
          await showLoggedIn(data.user);
          redirectToReturnToWithSession(data.session);
        } catch (err) {
          console.error("[Auth] Unexpected error during login:", err);
          setMsg("Login failed: " + err.message);
        }
      });

      document.getElementById("register").addEventListener("click", async () => {
        try {
          setMsg("");
          const email = emailEl.value.trim();
          const password = passwordEl.value;

          console.log("[Auth] Registration attempt for:", email);

          // Validate inputs
          if (!validateInputs(email, password)) {
            return;
          }

          const { data, error } = await supabase.auth.signUp({ email, password });
          
          if (error) {
            console.error("[Auth] Registration error:", error);
            setMsg(error.message);
            return;
          }

          // If email confirmations are enabled, session can be null until confirmed
          if (!data.session) {
            console.log("[Auth] Registration successful, awaiting email confirmation");
            setMsg(strings[lang].checkEmail);
            return;
          }

          console.log("[Auth] Registration successful with immediate session for:", data.user.email);
          await showLoggedIn(data.user);
          redirectToReturnToWithSession(data.session);
        } catch (err) {
          console.error("[Auth] Unexpected error during registration:", err);
          setMsg("Registration failed: " + err.message);
        }
      });

      document.getElementById("saveName").addEventListener("click", async () => {
        try {
          setMsg("");
          console.log("[Profile] Attempting to save display name");
          
          const { data } = await supabase.auth.getUser();
          const user = data.user;
          
          if (!user) {
            console.error("[Profile] No user found when saving name");
            setMsg(strings[lang].notLoggedIn);
            return;
          }

          const display_name = nameEl.value.trim();
          console.log("[Profile] Saving display name for user:", user.email);

          const { error } = await supabase
            .from("profiles")
            .upsert({ user_id: user.id, display_name })
            .eq("user_id", user.id);

          if (error) {
            console.error("[Profile] Error saving display name:", error);
            setMsg(error.message);
          } else {
            console.log("[Profile] Display name saved successfully");
            setMsg(strings[lang].saved);
          }
        } catch (err) {
          console.error("[Profile] Unexpected error saving name:", err);
          setMsg("Failed to save name: " + err.message);
        }
      });

      document.getElementById("logout").addEventListener("click", async () => {
        try {
          console.log("[Auth] Logging out");
          await supabase.auth.signOut();
          await showLoggedOut();
          setMsg(strings[lang].loggedOut);
          console.log("[Auth] Logout successful");
        } catch (err) {
          console.error("[Auth] Error during logout:", err);
          setMsg("Logout failed: " + err.message);
        }
      });

      document.getElementById("back").addEventListener("click", async () => {
        try {
          console.log("[Navigation] Back button clicked");
          const { data } = await supabase.auth.getSession();
          
          if (data.session) {
            console.log("[Navigation] Session exists, redirecting with session");
            redirectToReturnToWithSession(data.session);
          } else {
            console.log("[Navigation] No session, redirecting without session");
            if (isValidReturnToUrl(returnTo)) {
              location.assign(returnTo);
            } else {
              console.error("[Navigation] Invalid returnTo URL");
              setMsg("Invalid return URL");
            }
          }
        } catch (err) {
          console.error("[Navigation] Error in back handler:", err);
          setMsg("Navigation failed: " + err.message);
        }
      });

      // Requires /api/delete-user on accounts.xmenu.dev (Vercel serverless)
      document.getElementById("delete").addEventListener("click", async () => {
        try {
          setMsg("");
          console.log("[Account] Delete account requested");
          
          const { data } = await supabase.auth.getSession();
          const s = data.session;
          
          if (!s) {
            console.error("[Account] No session found for delete");
            setMsg(strings[lang].notLoggedIn);
            return;
          }

          console.log("[Account] Calling delete-user API");
          const res = await fetch("/api/delete-user", {
            method: "POST",
            headers: {
              "content-type": "application/json",
              "authorization": "Bearer " + s.access_token
            },
            body: "{}"
          });

          if (!res.ok) {
            const errorText = await res.text();
            console.error("[Account] Delete failed:", errorText);
            setMsg(errorText);
            return;
          }

          console.log("[Account] Account deleted successfully");
          await supabase.auth.signOut();
          location.assign(returnTo);
        } catch (err) {
          console.error("[Account] Error deleting account:", err);
          setMsg("Failed to delete account: " + err.message);
        }
      });

      // Initial state
      console.log("[Init] Initializing accounts page");
      console.log("[Init] ReturnTo URL:", returnTo);
      
      // Validate returnTo URL
      if (!isValidReturnToUrl(returnTo)) {
        console.warn("[Init] Invalid returnTo URL, using default");
        setMsg("Warning: Invalid return URL provided");
      }
      
      updateLang();
      
      try {
        // Check if we're coming back from an OAuth flow (hash parameters)
        const hashParams = new URLSearchParams(location.hash.slice(1));
        if (hashParams.has("access_token")) {
          console.log("[Init] Found OAuth tokens in hash, processing...");
          const accessToken = hashParams.get("access_token");
          const refreshToken = hashParams.get("refresh_token");
          
          if (accessToken && refreshToken) {
            const { data, error } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken
            });
            
            if (error) {
              console.error("[Init] Error setting session from hash:", error);
              setMsg("Failed to restore session: " + error.message);
            } else if (data.session) {
              console.log("[Init] Session restored from hash");
              // Clear the hash
              history.replaceState(null, "", location.pathname + location.search);
            }
          }
        }
        
        // Check current session
        console.log("[Init] Checking for existing session");
        const { data } = await supabase.auth.getUser();
        
        if (data.user) {
          console.log("[Init] User is logged in:", data.user.email);
          await showLoggedIn(data.user);
        } else {
          console.log("[Init] No active session");
          await showLoggedOut();
        }
      } catch (err) {
        console.error("[Init] Error during initialization:", err);
        setMsg("Initialization error: " + err.message);
        await showLoggedOut();
      }
    </script>
  </body>
</html>
